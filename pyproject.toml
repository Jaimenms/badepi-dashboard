[project]
name = "badepi"
version = "0.1.0"
description = "Pipeline medalhão (bronze → silver → gold) para os microdados BADEPI do INPI e dashboard publicado no GitHub Pages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaime Neiva Miranda de Souza" }]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "tqdm>=4.66",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
badepi = "badepi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badepi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
