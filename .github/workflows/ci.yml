# Testes unitários do pacote badepi (sem baixar dados do INPI).
# Execução apenas manual (Actions → CI → Run workflow) para não consumir cota.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q
