# Publica a pasta docs/ no GitHub Pages.
# Execução apenas manual (Actions → Publicar GitHub Pages → Run workflow), para não consumir cota.
# Em Settings → Pages, a origem deve ser "GitHub Actions".
name: Publicar GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
